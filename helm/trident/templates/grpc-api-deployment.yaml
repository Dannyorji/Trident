apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trident.fullname" . }}-grpc-api
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: grpc-api
spec:
  replicas: {{ .Values.grpcApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "trident.selectorLabels" (dict "root" . "component" "grpc-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trident.selectorLabels" (dict "root" . "component" "grpc-api") | nindent 8 }}
    spec:
      {{- include "trident.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "trident.podSecurityContext" (dict "uid" .Values.grpcApi.securityContextUid) | nindent 8 }}
      containers:
        - name: grpc-api
          image: "{{ .Values.grpcApi.image.repository }}:{{ .Values.grpcApi.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "trident.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: grpc
              containerPort: {{ .Values.grpcApi.service.port }}
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.internalMTLS.enabled }}
            - name: internal-mtls
              mountPath: {{ .Values.internalMTLS.mountPath }}
              readOnly: true
            {{- end }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: REDIS_URL
            {{- if .Values.internalMTLS.enabled }}
            # Behind a flag (issue #320): the gRPC server presents
            # INTERNAL_SERVER_CERT/_KEY and verifies callers against
            # INTERNAL_CA_CERT. Certs come from global.existingSecret via the
            # internal-mtls volume above, never baked into the image.
            - name: GRPC_MTLS_ENABLED
              value: "true"
            - name: GRPC_MTLS_CA_CERT
              value: "{{ .Values.internalMTLS.mountPath }}/ca.crt"
            - name: GRPC_MTLS_SERVER_CERT
              value: "{{ .Values.internalMTLS.mountPath }}/server.crt"
            - name: GRPC_MTLS_SERVER_KEY
              value: "{{ .Values.internalMTLS.mountPath }}/server.key"
            {{- end }}
            {{- range $k, $v := .Values.grpcApi.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.grpcApi.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.grpcApi.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.grpcApi.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.internalMTLS.enabled }}
        - name: internal-mtls
          secret:
            secretName: {{ .Values.global.existingSecret }}
            items:
              - key: INTERNAL_CA_CERT
                path: ca.crt
              - key: INTERNAL_SERVER_CERT
                path: server.crt
              - key: INTERNAL_SERVER_KEY
                path: server.key
        {{- end }}
      {{- with .Values.grpcApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grpcApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grpcApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trident.fullname" . }}-grpc-api
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: grpc-api
spec:
  type: ClusterIP
  selector:
    {{- include "trident.selectorLabels" (dict "root" . "component" "grpc-api") | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.grpcApi.service.port }}
      targetPort: grpc
      protocol: TCP
