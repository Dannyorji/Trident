{{/*
Prometheus Operator ServiceMonitor for the Go API (issue #768).

monitoring/alerts.yml's TridentAPIProcessDown alert reads
up{job="trident-api"} — that series only exists once something scrapes the
Go API's metrics Service, which this object wires up. jobLabel matches
.Values.monitoring.goApi.jobLabel, which must stay "trident-api" unless the
alert rule's job= matcher is updated to match.

Scrapes the dedicated "metrics" port (METRICS_PORT, go-api-deployment.yaml),
not the public "http" port — the internal, richer metrics registry (issue
#58), not the legacy /metrics route on the public mux.
*/}}
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "trident.fullname" . }}-go-api
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: go-api
    {{- with .Values.monitoring.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # "job" names the Service label (set on the go-api Service above) whose
  # value becomes Prometheus's `job` label — not a literal override.
  jobLabel: job
  selector:
    matchLabels:
      {{- include "trident.selectorLabels" (dict "root" . "component" "go-api") | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.goApi.interval }}
      scrapeTimeout: {{ .Values.monitoring.goApi.scrapeTimeout }}
{{- end }}
