# CI overlay for the Trident full-stack smoke test.
#
# Usage:
#   docker compose \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.ci.yml \
#     --env-file .env.ci \
#     up -d
#
# What this overlay does:
#   - Adds the Rust gRPC API service (not present in the base compose).
#   - Bypasses PgBouncer — all services connect directly to postgres:5432.
#     This removes one dependency layer and avoids the scram-sha-256
#     auth-type bootstrapping that PgBouncer needs.
#   - Disables restart policies so a crashed container surfaces as a hard
#     failure instead of retrying silently.
#   - Sets CI-appropriate log levels and disables resource limits.
#   - Exposes the Go API on a predictable host port for curl probing.
#   - Seeds the test API key into postgres on first start via the postgres
#     initdb mechanism (before any application service starts).

services:
  # ---------------------------------------------------------------------------
  # Postgres — apply the real migration chain, then seed the test API key.
  # The base compose does not mount initdb scripts; we add them here.
  #
  # The whole migrations directory is mounted rather than schema.sql plus a
  # hand-picked subset of migrations. That older arrangement drifted every
  # time someone added a migration without also updating schema.sql — most
  # recently leaving out webhook_subscriptions, so initdb aborted with
  # `relation "webhook_subscriptions" does not exist` and every e2e job died
  # on a postgres that never finished starting (issue #371).
  #
  # postgres' initdb runs *.sql in lexical order, and the migrations are
  # zero-padded and unique (enforced by scripts/check-migration-versions.sh),
  # so mounting the directory applies them in the same order as production.
  # The 99_ prefix keeps the CI seed last.
  # ---------------------------------------------------------------------------
  postgres:
    restart: "no"
    environment:
      # Override to use simple md5 so PgBouncer auth bootstrapping is not needed
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./ci-initdb.sh:/docker-entrypoint-initdb.d/01_migrations.sh:ro
      - ./ci-seed.sql:/docker-entrypoint-initdb.d/99_ci_seed.sql:ro

  # ---------------------------------------------------------------------------
  # Redis — no changes needed; just disable restart.
  # ---------------------------------------------------------------------------
  redis:
    restart: "no"
    ports:
      - "6380:6379"

  # ---------------------------------------------------------------------------
  # PgBouncer — opt-in in CI. Application traffic still connects directly to
  # Postgres; the e2e job enables it to test the admin statistics endpoint.
  # ---------------------------------------------------------------------------
  pgbouncer:
    profiles:
      - pgbouncer  # only started when this profile is explicitly selected
    environment:
      # CI only: the admin console (the virtual `pgbouncer` database behind
      # GET /v1/admin/db) cannot authenticate under scram-sha-256 on
      # PgBouncer 1.15 — even with auth_query resolving the user, SCRAM
      # verification against the console fails, which is why that endpoint
      # has never returned 200 in CI. md5 works and is adequate here: the
      # credential is the publicly-documented `.env.ci` fixture password on a
      # container-network-only port.
      #
      # The base compose keeps scram-sha-256 for real deployments. Fold this
      # override away once PgBouncer is upgraded past 1.15 (see the pin note
      # in docker-compose.yml) and confirm the endpoint still answers 200.
      PGBOUNCER_AUTH_TYPE: md5

  # ---------------------------------------------------------------------------
  # Rust gRPC API — added here because it is not in the base compose.
  #
  # The base compose has no grpc-api service; it is defined only in this
  # overlay so the full stack (indexer + grpc-api + go-api) can be wired
  # together for smoke tests.
  # ---------------------------------------------------------------------------
  grpc-api:
    build:
      context: ..
      dockerfile: crates/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GRPC_ADDR: 0.0.0.0:50051
      REDIS_URL: ${REDIS_URL}
      RUST_LOG: ${LOG_LEVEL:-info}
      GRPC_API_DB_POOL_SIZE: ${GRPC_API_DB_POOL_SIZE:-5}
      # In-flight buffer per StreamEvents subscriber. Filling it blocks that
      # subscriber's Redis consumer rather than queueing without limit.
      STREAM_CHANNEL_BUFFER: ${STREAM_CHANNEL_BUFFER:-128}
    expose:
      - "50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: "no"

  # ---------------------------------------------------------------------------
  # Rust indexer — bypass PgBouncer, lower poll interval for faster startup.
  # ---------------------------------------------------------------------------
  indexer:
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL}
      NETWORK: ${NETWORK:-testnet}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-5000}
      INDEX_DIAGNOSTIC: ${INDEX_DIAGNOSTIC:-false}
      METRICS_PORT: ${METRICS_PORT:-9090}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUST_LOG: ${LOG_LEVEL:-info}
    # Replace (not merge with) the base depends_on so the profile-disabled
    # pgbouncer dependency is dropped in CI.
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${METRICS_PORT:-9090}/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Go REST API — bypass PgBouncer, point gRPC at the grpc-api service.
  # ---------------------------------------------------------------------------
  api:
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      # Point at the grpc-api service defined in this overlay, not localhost.
      GRPC_ADDR: grpc-api:50051
      PORT: ${PORT:-3000}
      API_KEY_SALT: ${API_KEY_SALT}
      API_KEY_HASHES: ${API_KEY_HASHES}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CORS_DEV_MODE: ${CORS_DEV_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Leave ample room for the contract cases, then deliberately exhaust
      # this public-endpoint limit to verify documented 429 responses.
      PER_IP_RATE_LIMIT_RPS: 100
      RATE_LIMIT_FREE_RPS: 100
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    # Replace (not merge with) the base depends_on so the profile-disabled
    # pgbouncer dependency is dropped in CI.
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      grpc-api:
        condition: service_started
