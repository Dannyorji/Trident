events {}

http {
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1000;

    # Header/URL length limits (issue #317): bound the request line and
    # header buffers so an oversized/hostile header set or URL is rejected
    # (414/400) before it ever reaches the Go API's own MaxHeaderBytes.
    large_client_header_buffers 4 16k;
    client_header_buffer_size 4k;

    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

        # HSTS (issue #320): tell browsers to only ever speak HTTPS to this
        # host for the next year, including subdomains, and allow preload-list
        # submission. `always` so the header is also sent on error responses
        # (4xx/5xx), not just 2xx. Safe to add unconditionally here because the
        # server block above already redirects all plain HTTP to HTTPS — there
        # is no legitimate plain-HTTP response this could ever downgrade.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # /internal/* is for cluster-internal callers only (see
        # services/api/handlers/status.go, which layers its own
        # X-Internal-Key auth on top of this). Block it here too so a
        # misconfigured upstream route can never expose it publicly through
        # this proxy — defense in depth, not the only control.
        location /internal/ {
            deny all;
            return 403;
        }

        # Prometheus metrics are served only on the API's internal
        # METRICS_PORT listener, never through the public proxy. The API no
        # longer mounts /metrics on its public port; this is defence in depth
        # so a regression there can't expose it.
        location ~ ^/metrics(/|$) {
            return 404;
        }

        location / {
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /ws {
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        location /v1/events/stream {
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }
    }
}
