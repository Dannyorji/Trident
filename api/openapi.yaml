              description: Request ID for debugging

  headers:
    X-RateLimit-Limit:
      description: >-
        Requests allowed per window for this API key's rate-limit tier.
        Present on every response from an endpoint secured by ApiKeyAuth
        (2xx and 429 alike) once a valid X-API-Key was presented.
      required: true
      schema:
        type: integer
        minimum: 0
      example: 50

    X-RateLimit-Remaining:
      description: >-
        Requests remaining in the current window for this API key. 0 on the
        response that triggers a 429.
      required: true
      schema:
        type: integer
        minimum: 0
      example: 12

    X-RateLimit-Reset:
      description: >-
        Unix timestamp (seconds) when the current rate-limit window resets.
      required: true
      schema:
        type: integer
        format: int64
      example: 1732900000

    Retry-After:
      description: >-
        Seconds to wait before retrying. Present on 429 (rate limit
        exceeded, per-API-key or per-IP) and on 503 responses caused by the
        global concurrency cap shedding load. Not present on a 503 caused by
        an unavailable dependency (database/Redis/gRPC backend) — check the
        error envelope's `error.code` to distinguish the two.
      schema:
        type: integer
        minimum: 1
      example: 1

    X-Cache:
      description: >-
        Whether this response was served from the Redis response cache
        (HIT) or freshly computed (MISS). Only emitted by endpoints that
        cache their response.
      required: true
      schema:
        type: string
        enum: [HIT, MISS]
      example: HIT

    Idempotent-Replayed:
      description: >-
        Present and set to "true" only when this response was replayed from
        a prior request carrying the same Idempotency-Key (issue #225).
        Absent on the original (first) execution.
      required: false
      schema:
        type: string
        enum: ["true"]
      example: "true"

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: An unexpected server-side error occurred (error.code INTERNAL)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    RateLimitExceeded:
      description: >-
        Rate limit exceeded for this API key's tier (error.code
        RATE_LIMITED). Carries the same X-RateLimit-* headers as a
        successful response (X-RateLimit-Remaining is 0) plus Retry-After.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequestsIPOnly:
      description: >-
        Per-IP rate limit exceeded (error.code RATE_LIMITED). Applies to
        endpoints not covered by per-API-key limiting (public endpoints, or
        admin endpoints authenticated via ADMIN_API_KEY rather than
        X-API-Key) — only Retry-After is set, no X-RateLimit-* headers.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServiceUnavailable:
      description: >-
        Service temporarily unavailable — either a dependency (database,
        Redis, gRPC backend) is down, or the server is shedding load under
        the global concurrency cap. When load-shedding is the cause,
        Retry-After is set; otherwise it is absent.
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: >-
        The supplied Idempotency-Key was already used with a request that
        does not match this one (error.code CONFLICT). Retry with a new key,
        or resend the exact original request body to get the original
        response replayed instead (issue #225).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opt-in de-duplication for retried create requests (issue #225). A
        retry carrying the same key and an identical request body replays
        the original response (see the `Idempotent-Replayed: true` response
        header) instead of creating a second resource. The same key reused
        with a different body is rejected with 409 Conflict. Keys are
        remembered for 24 hours; max length 255 characters.
      schema:
        type: string
        maxLength: 255
      example: 7da8f2b1-2e3c-4b8a-9f0d-6a1e5c3d9b7f

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication

    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Admin key for admin endpoints (environment variable)

tags:
  - name: System
    description: System and health endpoints
  - name: Events
    description: Event querying and streaming
  - name: Statistics
    description: Analytics and statistics endpoints
  - name: API Keys
    description: API key management (admin only)
  - name: Admin
    description: Admin endpoints
  - name: Metrics
    description: Monitoring and metrics
  - name: Contracts
    description: Contract schema, spec, storage, and simulation endpoints
  - name: Webhooks
    description: Webhook subscriptions and delivery management (not yet part of the frozen v1 surface)
  - name: Usage
    description: Self-serve API key usage reporting
