          type: string
          enum: [ok, degraded]
          description: '"degraded" when any dependency check in `checks` failed.'
        indexer_lag:
          type: integer
          format: int64
          nullable: true
          description: >-
            Ledgers behind chain tip, from system_state. Null when Postgres
