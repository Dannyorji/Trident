    VersionResponse:
      type: object
      required:
        - version
        - commit_sha
        - build_timestamp
        - schema_version
      properties:
        version:
          type: string
          description: >-
            Semantic version tag of the running build, or "dev" for a binary
            built without release ldflags.
          example: v1.2.3
        commit_sha:
          type: string
          description: >-
            Full git commit SHA the binary was built from, or "unknown" when
            not injected at build time.
          example: 2e6ad17c8f9b4a1d3e5f7a9c2b4d6e8f0a1c3e5d
        build_timestamp:
          type: string
          description: >-
            RFC 3339 build time, or "unknown" when not injected at build
            time. Not typed as date-time because of that sentinel.
          example: "2026-08-26T15:19:00Z"
        schema_version:
          type: string
          nullable: true
          description: >-
            Highest applied migration version from _sqlx_migrations, as a
            string. Null when no migrations have been applied yet or when
            Postgres is unreachable — the endpoint still returns 200 in that
            case so build metadata stays available during an outage.

