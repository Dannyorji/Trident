        - grpc_api
      properties:
        postgres:
          type: string
          description: '"ok" or "error: <message>"'
        redis:
          type: string
          description: '"ok" or "error: <message>"'
        grpc_api:
          type: string
          description: '"ok" or "error: <message>"'

