# Alerts on RPC provider degradation — latency and error-rate, not just
# outright failure — so ops can see "RPC is degraded" before it turns into
# ingest lag (issue #294). Complements the ingest-freshness SLO alerts in
# observability/burn-rate-alerts.yml, which fire on the downstream symptom
# (lag) rather than the RPC-layer cause.
#
# Metrics: trident_indexer_rpc_call_duration_seconds{method,endpoint} and
# trident_indexer_rpc_errors_total{method,error_type} — see
# crates/indexer/src/metrics.rs and docs/observability/event-delivery.md.
#
# Validate with: promtool check rules observability/rpc-alerts.yml
# (not run as part of this change — promtool wasn't available in the
# environment this was authored in).

groups:
  - name: trident-rpc-health
    rules:
      - alert: TridentRPCHighErrorRate
        expr: |
          sum(rate(trident_indexer_rpc_errors_total[5m]))
          /
          sum(rate(trident_indexer_rpc_call_duration_seconds_count[5m]))
          > 0.1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "RPC error rate above 10% over 5m"
          description: >-
            More than 10% of Stellar RPC calls have failed over the last 5
            minutes. Break down by error_type on
            trident_indexer_rpc_errors_total to tell a rate-limited or
            timing-out provider apart from bad request shape
            (invalid_cursor). Check trident_indexer_rpc_active_endpoint for
            whether failover has already kicked in.
          runbook_url: "docs/runbooks/alerts.md#tridentrpchigherrorrate"

      - alert: TridentRPCHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(trident_indexer_rpc_call_duration_seconds_bucket[5m])) by (le, method)
          ) > 5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "RPC p95 latency above 5s for {{ $labels.method }}"
          description: >-
            p95 latency for {{ $labels.method }} has exceeded 5s for 10
            minutes — a degraded-but-still-responding provider, distinct from
            outright timeouts (trident_indexer_rpc_timeouts_total). Left
            unaddressed this typically turns into ingest lag
            (trident_indexer_ledger_lag).
          runbook_url: "docs/runbooks/alerts.md#tridentrpchighlatency"

      - alert: TridentRPCFailoverActive
        expr: trident_indexer_rpc_active_endpoint > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Indexer has been running on a fallback RPC endpoint for 5m+"
          description: >-
            trident_indexer_rpc_active_endpoint has been non-zero (not the
            primary) for at least 5 minutes — the primary RPC endpoint has
            not recovered. Check trident_indexer_rpc_failovers_total for how
            often this pool has been flapping between endpoints.
          runbook_url: "docs/runbooks/alerts.md#tridentrpcfailoveractive"

      - alert: TridentRPCRateLimited
        expr: sum(rate(trident_indexer_rpc_errors_total{error_type="rate_limited"}[5m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Stellar RPC provider is rate-limiting the indexer"
          description: >-
            trident_indexer_rpc_errors_total{error_type="rate_limited"} has
            been climbing for 5m+. Sustained rate-limiting degrades ingest
            freshness the same way an outage does; consider raising the
            provider's quota or adding a secondary endpoint to the pool
            (issue #213).
          runbook_url: "docs/runbooks/alerts.md#tridentrpcratelimited"

      - alert: TridentRPCHealthScoreLow
        expr: trident_rpc_health_score < 50
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "RPC endpoint {{ $labels.endpoint }} health score is degraded ({{ $value }}/100)"
          description: >-
            trident_rpc_health_score for {{ $labels.endpoint }} has been
            below 50 (the midpoint of its 0-100 scale, crates/indexer/src/rpc/health.rs)
            for 10 minutes — the scorer is penalizing this endpoint faster
            than it recovers, ahead of the pool actually failing over. Check
            trident_indexer_rpc_errors_total and
            trident_indexer_rpc_call_duration_seconds for this endpoint to
            see which is driving the penalty.
          runbook_url: "docs/runbooks/alerts.md#tridentrpchealthscorelow"

      - alert: TridentRPCHealthScoreCritical
        expr: trident_rpc_health_score < 20
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "RPC endpoint {{ $labels.endpoint }} health score is critical ({{ $value }}/100)"
          description: >-
            trident_rpc_health_score for {{ $labels.endpoint }} has been
            below 20 for 5 minutes — near the scorer's floor of 0. If this
            is the only configured endpoint, ingest is likely already
            degraded; check trident_indexer_rpc_active_endpoint to confirm
            whether failover to another endpoint has occurred.
          runbook_url: "docs/runbooks/alerts.md#tridentrpchealthscorecritical"
