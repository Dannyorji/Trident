# Multi-window, multi-burn-rate alerts for the SLOs defined in docs/slo.md
# (issue #296). Follows the Google SRE workbook pattern: a short window
# confirms the burn is happening *now*, a long window confirms it's
# sustained (not a blip) — both must breach before paging.
#
# Validate with: promtool check rules observability/burn-rate-alerts.yml
#
# SLO 1 (ingest freshness) and SLO 2/3 (API latency/availability) all have
# live metrics today. #295 shipped trident_api_http_requests_total and
# trident_api_http_request_duration_seconds (services/api/middleware/
# metrics.go), unblocking the SLO 2/3 rules that were previously stubbed
# out here (#770).

groups:
  - name: trident-slo-ingest-freshness
    rules:
      # Error ratio: fraction of time ledger lag exceeded the 30s target,
      # over the two windows the multi-burn-rate check below compares.
      - record: trident:ingest_freshness_error_ratio5m
        expr: 1 - avg_over_time((trident_indexer_ledger_lag <= bool 30)[5m:1m])
      - record: trident:ingest_freshness_error_ratio1h
        expr: 1 - avg_over_time((trident_indexer_ledger_lag <= bool 30)[1h:1m])
      - record: trident:ingest_freshness_error_ratio30m
        expr: 1 - avg_over_time((trident_indexer_ledger_lag <= bool 30)[30m:1m])
      - record: trident:ingest_freshness_error_ratio6h
        expr: 1 - avg_over_time((trident_indexer_ledger_lag <= bool 30)[6h:1m])

      # Fast burn: consuming the 28-day, 5%-error-budget SLO (target 95%,
      # docs/slo.md SLO 1) at 14.4x — exhausts the whole monthly budget in
      # ~2 days if sustained. 5m confirms it's happening now, 1h confirms
      # it isn't a single blip.
      - alert: IngestFreshnessFastBurn
        expr: |
          trident:ingest_freshness_error_ratio5m > (14.4 * 0.05)
          and
          trident:ingest_freshness_error_ratio1h > (14.4 * 0.05)
        for: 2m
        labels:
          severity: page
          slo: ingest-freshness
        annotations:
          summary: "Ledger lag SLO fast-burn — indexer is falling behind quickly"
          description: >-
            trident_indexer_ledger_lag has exceeded 30s for a large share of
            both the last 5m and the last 1h. At this burn rate the 28-day
            error budget is exhausted in under 2 days. Check
            trident_indexer_rpc_retries_total / trident_indexer_rpc_failovers_total
            and trident_indexer_last_poll_timestamp_seconds for a stalled or
            struggling poll loop.
          runbook_url: "docs/runbooks/alerts.md#ingestfreshnessfastburn"

      # Slow burn: 6x burn rate — exhausts the budget in ~5 days if
      # sustained. Longer windows (30m/6h) so this doesn't fire on
      # transient blips the fast-burn rule would already catch anyway.
      - alert: IngestFreshnessSlowBurn
        expr: |
          trident:ingest_freshness_error_ratio30m > (6 * 0.05)
          and
          trident:ingest_freshness_error_ratio6h > (6 * 0.05)
        for: 15m
        labels:
          severity: ticket
          slo: ingest-freshness
        annotations:
          summary: "Ledger lag SLO slow-burn — sustained elevated lag"
          description: >-
            trident_indexer_ledger_lag has exceeded 30s for a sustained
            share of both the last 30m and the last 6h. Not urgent enough to
            page, but investigate before it becomes a fast burn.
          runbook_url: "docs/runbooks/alerts.md#ingestfreshnessslowburn"

      # Dead-man's-switch: catches a fully stalled indexer that a lag-ratio
      # rule alone can miss if the gauge itself stops updating.
      - alert: IndexerHeartbeatStalled
        expr: time() - trident_indexer_last_poll_timestamp_seconds > 120
        for: 1m
        labels:
          severity: page
          slo: ingest-freshness
        annotations:
          summary: "Indexer poll loop has not completed a cycle in over 2 minutes"
          description: >-
            trident_indexer_last_poll_timestamp_seconds has not advanced —
            the indexer process may be hung, crashed, or stuck retrying RPC.
          runbook_url: "docs/runbooks/alerts.md#indexerheartbeatstalled"

      # Direct threshold alert on sustained high lag (issue #293), independent
      # of the error-budget/burn-rate math above: a straightforward "lag has
      # been high for a while" signal for anyone not fluent in the SLO
      # calculation, mirroring the fields exposed by GET /v1/stats/indexer
      # (see docs/observability/data-freshness.md).
      - alert: TridentIngestLagSustainedHigh
        expr: trident_indexer_ledger_lag_seconds_estimated > 500
        for: 10m
        labels:
          severity: page
          slo: ingest-freshness
        annotations:
          summary: "Indexer ledger lag above 100 ledgers (~500s estimated) for 10m+"
          description: >-
            trident_indexer_ledger_lag_seconds_estimated (lag_ledgers * ~5s/
            ledger, see docs/observability/data-freshness.md) has been above
            {{ $value | humanizeDuration }} for 10 minutes straight — over
            100 ledgers behind. Check
            trident_indexer_rpc_errors_total / trident_indexer_rpc_active_endpoint
            (observability/rpc-alerts.yml) for whether the RPC provider is
            the cause.
          runbook_url: "docs/runbooks/alerts.md#tridentingestlagsustainedhigh"

  - name: trident-slo-api-availability
    rules:
      # Error ratio: fraction of requests returning 5xx, over the windows the
      # multi-burn-rate check below compares. docs/slo.md SLO 3 target: 99.5%
      # non-5xx over a rolling 28-day window (0.5% error budget).
      - record: trident:api_availability_error_ratio5m
        expr: |
          1 - (
            sum(rate(trident_api_http_requests_total{status!~"5.."}[5m]))
            /
            sum(rate(trident_api_http_requests_total[5m]))
          )
      - record: trident:api_availability_error_ratio1h
        expr: |
          1 - (
            sum(rate(trident_api_http_requests_total{status!~"5.."}[1h]))
            /
            sum(rate(trident_api_http_requests_total[1h]))
          )
      - record: trident:api_availability_error_ratio30m
        expr: |
          1 - (
            sum(rate(trident_api_http_requests_total{status!~"5.."}[30m]))
            /
            sum(rate(trident_api_http_requests_total[30m]))
          )
      - record: trident:api_availability_error_ratio6h
        expr: |
          1 - (
            sum(rate(trident_api_http_requests_total{status!~"5.."}[6h]))
            /
            sum(rate(trident_api_http_requests_total[6h]))
          )

      # Fast burn: 14.4x the 0.5%-error-budget SLO — exhausts the 28-day
      # budget in ~2 days if sustained. Same window pattern as ingest
      # freshness above.
      - alert: APIAvailabilityFastBurn
        expr: |
          trident:api_availability_error_ratio5m > (14.4 * 0.005)
          and
          trident:api_availability_error_ratio1h > (14.4 * 0.005)
        for: 2m
        labels:
          severity: page
          slo: api-availability
        annotations:
          summary: "API availability SLO fast-burn — 5xx rate consuming error budget quickly"
          description: >-
            Over {{ $value | humanizePercentage }} of API requests returned a
            5xx status in both the last 5m and the last 1h. At this burn rate
            the 28-day error budget (docs/slo.md SLO 3, target 99.5%) is
            exhausted in under 2 days. This is the same underlying signal as
            TridentAPIHTTP5xxRateHigh/Critical (monitoring/alerts.yml), framed
            as error-budget consumption instead of a flat threshold.
          runbook_url: "docs/runbooks/alerts.md#apiavailabilityfastburn"

      # Slow burn: 6x — exhausts the budget in ~5 days if sustained.
      - alert: APIAvailabilitySlowBurn
        expr: |
          trident:api_availability_error_ratio30m > (6 * 0.005)
          and
          trident:api_availability_error_ratio6h > (6 * 0.005)
        for: 15m
        labels:
          severity: ticket
          slo: api-availability
        annotations:
          summary: "API availability SLO slow-burn — sustained elevated 5xx rate"
          description: >-
            Over {{ $value | humanizePercentage }} of API requests returned a
            5xx status for a sustained share of both the last 30m and the
            last 6h. Not urgent enough to page, but investigate before it
            becomes a fast burn.
          runbook_url: "docs/runbooks/alerts.md#apiavailabilityslowburn"

  - name: trident-slo-api-latency
    rules:
      # p95 latency SLO, split by method since there is no class="read"|"write"
      # label yet (docs/slo.md SLO 2): GET targets 500ms, non-GET targets 1s.
      # Expressed as an error ratio (share of requests in the bucket at/under
      # the le=target bucket boundary) rather than a raw histogram_quantile,
      # so it composes with the same fast/slow burn-rate math as the other
      # two SLOs.
      - record: trident:api_read_latency_error_ratio5m
        expr: |
          1 - (
            sum(rate(trident_api_http_request_duration_seconds_bucket{method="GET",le="0.5"}[5m]))
            /
            sum(rate(trident_api_http_request_duration_seconds_count{method="GET"}[5m]))
          )
      - record: trident:api_read_latency_error_ratio1h
        expr: |
          1 - (
            sum(rate(trident_api_http_request_duration_seconds_bucket{method="GET",le="0.5"}[1h]))
            /
            sum(rate(trident_api_http_request_duration_seconds_count{method="GET"}[1h]))
          )
      - record: trident:api_read_latency_error_ratio30m
        expr: |
          1 - (
            sum(rate(trident_api_http_request_duration_seconds_bucket{method="GET",le="0.5"}[30m]))
            /
            sum(rate(trident_api_http_request_duration_seconds_count{method="GET"}[30m]))
          )
      - record: trident:api_read_latency_error_ratio6h
        expr: |
          1 - (
            sum(rate(trident_api_http_request_duration_seconds_bucket{method="GET",le="0.5"}[6h]))
            /
            sum(rate(trident_api_http_request_duration_seconds_count{method="GET"}[6h]))
          )

      - record: trident:api_write_latency_error_ratio5m
        expr: |
          1 - (
            sum(rate(trident_api_http_request_duration_seconds_bucket{method!="GET",le="1"}[5m]))
            /
            sum(rate(trident_api_http_request_duration_seconds_count{method!="GET"}[5m]))
          )
      - record: trident:api_write_latency_error_ratio1h
        expr: |
          1 - (
            sum(rate(trident_api_http_request_duration_seconds_bucket{method!="GET",le="1"}[1h]))
            /
            sum(rate(trident_api_http_request_duration_seconds_count{method!="GET"}[1h]))
          )
      - record: trident:api_write_latency_error_ratio30m
        expr: |
          1 - (
            sum(rate(trident_api_http_request_duration_seconds_bucket{method!="GET",le="1"}[30m]))
            /
            sum(rate(trident_api_http_request_duration_seconds_count{method!="GET"}[30m]))
          )
      - record: trident:api_write_latency_error_ratio6h
        expr: |
          1 - (
            sum(rate(trident_api_http_request_duration_seconds_bucket{method!="GET",le="1"}[6h]))
            /
            sum(rate(trident_api_http_request_duration_seconds_count{method!="GET"}[6h]))
          )

      - alert: APIReadLatencyFastBurn
        expr: |
          trident:api_read_latency_error_ratio5m > (14.4 * 0.05)
          and
          trident:api_read_latency_error_ratio1h > (14.4 * 0.05)
        for: 2m
        labels:
          severity: page
          slo: api-latency
        annotations:
          summary: "API read-route p95 latency SLO fast-burn — GET routes slower than 500ms"
          description: >-
            Over {{ $value | humanizePercentage }} of GET requests exceeded
            the 500ms p95 target (docs/slo.md SLO 2) in both the last 5m and
            the last 1h. At this burn rate the 28-day error budget (33.6h) is
            exhausted in under 2 days.
          runbook_url: "docs/runbooks/alerts.md#apireadlatencyfastburn"

      - alert: APIReadLatencySlowBurn
        expr: |
          trident:api_read_latency_error_ratio30m > (6 * 0.05)
          and
          trident:api_read_latency_error_ratio6h > (6 * 0.05)
        for: 15m
        labels:
          severity: ticket
          slo: api-latency
        annotations:
          summary: "API read-route p95 latency SLO slow-burn — sustained elevated latency"
          description: >-
            Over {{ $value | humanizePercentage }} of GET requests exceeded
            the 500ms p95 target for a sustained share of both the last 30m
            and the last 6h.
          runbook_url: "docs/runbooks/alerts.md#apireadlatencyslowburn"

      - alert: APIWriteLatencyFastBurn
        expr: |
          trident:api_write_latency_error_ratio5m > (14.4 * 0.05)
          and
          trident:api_write_latency_error_ratio1h > (14.4 * 0.05)
        for: 2m
        labels:
          severity: page
          slo: api-latency
        annotations:
          summary: "API write-route p95 latency SLO fast-burn — non-GET routes slower than 1s"
          description: >-
            Over {{ $value | humanizePercentage }} of non-GET requests
            exceeded the 1s p95 target (docs/slo.md SLO 2) in both the last 5m
            and the last 1h. At this burn rate the 28-day error budget is
            exhausted in under 2 days.
          runbook_url: "docs/runbooks/alerts.md#apiwritelatencyfastburn"

      - alert: APIWriteLatencySlowBurn
        expr: |
          trident:api_write_latency_error_ratio30m > (6 * 0.05)
          and
          trident:api_write_latency_error_ratio6h > (6 * 0.05)
        for: 15m
        labels:
          severity: ticket
          slo: api-latency
        annotations:
          summary: "API write-route p95 latency SLO slow-burn — sustained elevated latency"
          description: >-
            Over {{ $value | humanizePercentage }} of non-GET requests
            exceeded the 1s p95 target for a sustained share of both the last
            30m and the last 6h.
          runbook_url: "docs/runbooks/alerts.md#apiwritelatencyslowburn"
