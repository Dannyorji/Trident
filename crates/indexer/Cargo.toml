[package]
name = "trident-indexer"
version = "0.1.0"
edition = "2021"

[features]
# Opt-in async task profiling via tokio-console. Compiled out by default; even
# when compiled in it stays off at runtime unless TOKIO_CONSOLE_ENABLED=true.
# Full task instrumentation additionally requires building tokio with
# `RUSTFLAGS="--cfg tokio_unstable"`. See docs/observability/profiling.md.
tokio-console = ["dep:console-subscriber"]

[dependencies]
trident-common = { path = "../common" }
anyhow = "1"

# CLI subcommands (issue #574: `trident-indexer replay ...`). The daemon
# entrypoint (no subcommand) is unaffected.
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# Optional async profiling (tokio-console). Behind the `tokio-console` feature.
console-subscriber = { version = "0.4", optional = true }

# HTTP client for Stellar RPC JSON-RPC calls
reqwest = { version = "0.11", features = ["json"] }

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono", "json"] }

# Redis
redis = { version = "0.24", features = ["tokio-comp"] }

# Stellar XDR decoding — pin to a specific protocol version via the "curr" feature
# If the network upgrades to a new protocol, update this version accordingly.
stellar-xdr = { version = "26.0.1", features = ["curr"] }

# Strkey encoding for contract and account addresses
stellar-strkey = "0.0.16"

# Base64 decoding for XDR payloads
base64 = "0.22"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUIDs for event primary keys
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Hex encoding for bytes values
hex = "0.4"

# SHA-256 for SAC contract id derivation (issue #262)
sha2 = "0.10"

# Retry logic with exponential backoff
tokio-retry = "0.3"

# CancellationToken for graceful shutdown
tokio-util = "0.7"

# Async trait support for pluggable alert sinks
async-trait = "0.1"

# Prometheus /metrics endpoint
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# OpenTelemetry distributed tracing (issue #81)
opentelemetry = { version = "0.22", features = ["trace"] }
opentelemetry-otlp = { version = "0.15", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
tracing-opentelemetry = "0.23"

[dev-dependencies]
# Mock HTTP server for RPC integration tests
wiremock = "0.6"
# Database integration tests
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono", "json", "macros"] }
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
# Property-based testing for XDR parser fuzz coverage (issue #416)
proptest = "1"
