name: Set up Node.js
description: Node.js with an optional npm cache.

inputs:
  node-version:
    description: Node.js version.
    default: "20"
  cache-dependency-path:
    description: package-lock.json used as the npm cache key. Empty disables the cache.
    default: ""
  registry-url:
    description: npm registry URL (only needed when publishing).
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Node.js (cached)
      if: inputs.cache-dependency-path != ''
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Set up Node.js
      if: inputs.cache-dependency-path == ''
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
